# ===================================================================
#  media-suite — core stack
# ===================================================================
#  Deploy with ./scripts/install.sh, not by hand. If you must:
#    docker compose --env-file .env -f compose/compose.yml up -d
#
#  Routing convention (see docs/architecture.md):
#    Apps that tolerate a subpath get a path prefix on :443.
#    Apps that must own "/" get their own TLS entrypoint.
#      :443  → Homarr        :8443 → Plex/Jellyfin   :8444 → Uptime Kuma
# ===================================================================

x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}
  UMASK: ${UMASK}

x-logging: &logging
  driver: json-file
  options:
    max-file: ${DOCKERLOGGING_MAXFILE}
    max-size: ${DOCKERLOGGING_MAXSIZE}

# Healthchecks below deliberately use 127.0.0.1, never "localhost".
# In these images localhost resolves to ::1 first; the apps listen on
# IPv4 only. curl silently falls back, busybox wget does not — so a
# wget-based probe fails, the container never reports healthy, and
# Traefik's Docker provider drops it from routing entirely. The
# symptom is a 404 from the proxy for a container that is running
# perfectly well.
x-arr-service: &arr-service
  restart: unless-stopped
  logging: *logging
  networks: [traefik]
  depends_on:
    proxy:
      condition: service_healthy

services:
  # ─────────────────────────────────────────────────────────────────
  #  Traefik — TLS termination and routing for everything below
  # ─────────────────────────────────────────────────────────────────
  proxy:
    container_name: proxy
    image: traefik:${TRAEFIK_TAG}
    restart: always
    command:
      - "--global.sendAnonymousUsage=false"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/access.log"
      - "--accesslog.bufferingsize=100"
      - "--accesslog.filters.statuscodes=200,300-302"
      - "--accesslog.filters.retryattempts"
      - "--accesslog.filters.minduration=10ms"
      - "--accesslog.fields.defaultMode=keep"
      - "--accesslog.fields.names.ClientUsername=drop"
      - "--accesslog.fields.headers.names.User-Agent=redact"
      - "--accesslog.fields.headers.names.Authorization=drop"
      - "--accesslog.fields.headers.names.Content-Type=keep"
      # Dashboard is served through the router below, over TLS.
      # --api.insecure is deliberately NOT set: it would expose the
      # full API unauthenticated on the LAN.
      - "--api=true"
      - "--api.dashboard=true"
      - "--api.basepath=/admin"
      - "--ping=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.watch=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/config"
      - "--providers.file.watch=true"
      # Backends use self-signed certs or plain HTTP internally.
      - "--serversTransport.insecureSkipVerify=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure-media.address=:8443"
      - "--entrypoints.websecure-media.http.tls=true"
      - "--entrypoints.websecure-kuma.address=:8444"
      - "--entrypoints.websecure-kuma.http.tls=true"
      - "--entrypoints.websecure-auth.address=:8445"
      - "--entrypoints.websecure-auth.http.tls=true"
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/admin`)
      - traefik.http.routers.api.service=api@internal
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.priority=100
      # /admin → /admin/dashboard/
      - traefik.http.middlewares.api-redirect.redirectregex.regex=^(.*)/admin$$
      - traefik.http.middlewares.api-redirect.redirectregex.replacement=$$1/admin/dashboard/
      - traefik.http.routers.api.middlewares=auth@file,api-redirect
    ports:
      - target: 80
        published: 80
      - target: 443
        published: 443
      - target: 8443
        published: 8443
      - target: 8444
        published: 8444
      - target: 8445
        published: 8445
    environment: *common-env
    networks: [traefik]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - ${TRAEFIK_DIR}/acme:/etc/traefik/acme
      - ${TRAEFIK_DIR}/certificates:/etc/traefik/certificates
      - ${TRAEFIK_DIR}/config:/config
      - ${TRAEFIK_DIR}/logs:/logs
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────
  #  Homarr — dashboard, holds "/" on :443
  # ─────────────────────────────────────────────────────────────────
  homarr:
    <<: *arr-service
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:${HOMARR_TAG}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.homarr.rule=PathPrefix(`/`)
      - traefik.http.routers.homarr.priority=1
      - traefik.http.routers.homarr.entrypoints=websecure
      - traefik.http.routers.homarr.tls=true
      - traefik.http.routers.homarr.middlewares=auth@file
      - traefik.http.services.homarr.loadbalancer.server.port=7575
    environment:
      <<: *common-env
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/homarr:/appdata
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7575/ >/dev/null 2>&1 || wget -qO- http://127.0.0.1:7575/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─────────────────────────────────────────────────────────────────
  #  Radarr — films
  # ─────────────────────────────────────────────────────────────────
  radarr:
    <<: *arr-service
    container_name: radarr
    image: ghcr.io/hotio/radarr:${RADARR_TAG}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.radarr.rule=PathPrefix(`/movies`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls=true
      - traefik.http.routers.radarr.middlewares=auth@file
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    environment:
      <<: *common-env
      RADARR__SERVER__URLBASE: /movies
      # Auth is handled at the proxy. "External" tells the app to trust
      # it; "DisabledForLocalAddresses" means LAN requests skip the
      # login entirely. Verified to apply via env — the app never
      # writes these to config.xml, so do not look for them there.
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/radarr:/config
      - ${DOCKERSTORAGEDIR}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/movies/ping >/dev/null 2>&1 || wget -qO- http://127.0.0.1:7878/movies/ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  #  Sonarr — television
  # ─────────────────────────────────────────────────────────────────
  sonarr:
    <<: *arr-service
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:${SONARR_TAG}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.sonarr.rule=PathPrefix(`/tv`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.routers.sonarr.middlewares=auth@file
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    environment:
      <<: *common-env
      SONARR__SERVER__URLBASE: /tv
      # Auth is handled at the proxy. "External" tells the app to trust
      # it; "DisabledForLocalAddresses" means LAN requests skip the
      # login entirely. Verified to apply via env — the app never
      # writes these to config.xml, so do not look for them there.
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/sonarr:/config
      - ${DOCKERSTORAGEDIR}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/tv/ping >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8989/tv/ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  #  Lidarr — music
  # ─────────────────────────────────────────────────────────────────
  lidarr:
    <<: *arr-service
    container_name: lidarr
    image: ghcr.io/hotio/lidarr:${LIDARR_TAG}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.lidarr.rule=PathPrefix(`/music`)
      - traefik.http.routers.lidarr.entrypoints=websecure
      - traefik.http.routers.lidarr.tls=true
      - traefik.http.routers.lidarr.middlewares=auth@file
      - traefik.http.services.lidarr.loadbalancer.server.port=8686
    environment:
      <<: *common-env
      LIDARR__SERVER__URLBASE: /music
      # Auth is handled at the proxy. "External" tells the app to trust
      # it; "DisabledForLocalAddresses" means LAN requests skip the
      # login entirely. Verified to apply via env — the app never
      # writes these to config.xml, so do not look for them there.
      LIDARR__AUTH__METHOD: External
      LIDARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/lidarr:/config
      - ${DOCKERSTORAGEDIR}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8686/music/ping >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8686/music/ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  #  Prowlarr — indexer manager, syncs indexers to the apps above
  # ─────────────────────────────────────────────────────────────────
  prowlarr:
    <<: *arr-service
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:${PROWLARR_TAG}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.prowlarr.rule=PathPrefix(`/idx`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls=true
      - traefik.http.routers.prowlarr.middlewares=auth@file
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
    environment:
      <<: *common-env
      PROWLARR__SERVER__URLBASE: /idx
      # Auth is handled at the proxy. "External" tells the app to trust
      # it; "DisabledForLocalAddresses" means LAN requests skip the
      # login entirely. Verified to apply via env — the app never
      # writes these to config.xml, so do not look for them there.
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/prowlarr:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/idx/ping >/dev/null 2>&1 || wget -qO- http://127.0.0.1:9696/idx/ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  #  qBittorrent — download client
  # ─────────────────────────────────────────────────────────────────
  qbittorrent:
    <<: *arr-service
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent:${QBITTORRENT_TAG}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.qb.rule=PathPrefix(`/download`)
      - traefik.http.routers.qb.entrypoints=websecure
      - traefik.http.routers.qb.tls=true
      # Order matters: redirect must run BEFORE strip, or the trailing
      # -slash redirect can never match its own prefix.
      - traefik.http.routers.qb.middlewares=auth@file,qb-redirect,qb-strip,qb-headers
      - traefik.http.middlewares.qb-redirect.redirectregex.regex=^(.*)/download$$
      - traefik.http.middlewares.qb-redirect.redirectregex.replacement=$$1/download/
      - traefik.http.middlewares.qb-strip.stripprefix.prefixes=/download/
      # qBittorrent rejects cross-origin requests unless these are cleared.
      - traefik.http.middlewares.qb-headers.headers.customrequestheaders.X-Frame-Options=SAMEORIGIN
      - traefik.http.middlewares.qb-headers.headers.customrequestheaders.Referer=
      - traefik.http.middlewares.qb-headers.headers.customrequestheaders.Origin=
      - traefik.http.services.qb.loadbalancer.server.port=8080
      - traefik.http.services.qb.loadbalancer.passhostheader=false
    environment:
      <<: *common-env
      WEBUI_PORTS: 8080/tcp,8080/udp
      LIBTORRENT: v1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/qbittorrent:/config
      - ${DOCKERSTORAGEDIR}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  #  Plex — profile: plex. Holds "/" on :8443
  # ─────────────────────────────────────────────────────────────────
  plex:
    <<: *arr-service
    profiles: [plex]
    container_name: plex
    image: ghcr.io/hotio/plex:${PLEX_TAG}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.plex.rule=PathPrefix(`/`)
      - traefik.http.routers.plex.priority=1
      - traefik.http.routers.plex.entrypoints=websecure-media
      - traefik.http.routers.plex.tls=true
      - traefik.http.services.plex.loadbalancer.server.port=32400
    ports:
      # Direct access for Plex clients, which do not speak to the proxy.
      - 32400:32400
    environment:
      <<: *common-env
      PLEX_CLAIM_TOKEN: ${PLEX_CLAIM_TOKEN}
      PLEX_ADVERTISE_URL: ${PLEX_ADVERTISE_URL}
      # Was previously referencing an undefined variable, so local
      # clients were never actually trusted. Wired to LAN_NETWORK.
      PLEX_NO_AUTH_NETWORKS: ${LAN_NETWORK}
      PLEX_BETA_INSTALL: ${PLEX_BETA_INSTALL}
      PLEX_PURGE_CODECS: "false"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/plex/config:/config
      - ${DOCKERCONFDIR}/plex/transcode:/transcode
      - ${DOCKERSTORAGEDIR}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:32400/identity >/dev/null 2>&1 || wget -qO- http://127.0.0.1:32400/identity >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─────────────────────────────────────────────────────────────────
  #  Jellyfin — profile: jellyfin. Holds "/" on :8443
  # ─────────────────────────────────────────────────────────────────
  jellyfin:
    <<: *arr-service
    profiles: [jellyfin]
    container_name: jellyfin
    image: ghcr.io/hotio/jellyfin:${JELLYFIN_TAG}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.jellyfin.rule=PathPrefix(`/`)
      - traefik.http.routers.jellyfin.priority=1
      - traefik.http.routers.jellyfin.entrypoints=websecure-media
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    ports:
      - 8096:8096
      # Client auto-discovery on the LAN.
      - 7359:7359/udp
    environment:
      <<: *common-env
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHED_SERVER_URL}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/jellyfin/config:/config
      - ${DOCKERCONFDIR}/jellyfin/cache:/cache
      - ${DOCKERSTORAGEDIR}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8096/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─────────────────────────────────────────────────────────────────
  #  Uptime Kuma — profile: monitoring. Holds "/" on :8444
  #
  #  No subpath support upstream (UPTIME_KUMA_BASE_PATH exists only in
  #  closed PRs), hence its own entrypoint rather than a path prefix.
  # ─────────────────────────────────────────────────────────────────
  uptime-kuma:
    <<: *arr-service
    profiles: [monitoring]
    container_name: uptime-kuma
    image: louislam/uptime-kuma:${UPTIME_KUMA_TAG}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.kuma.rule=PathPrefix(`/`)
      - traefik.http.routers.kuma.priority=1
      - traefik.http.routers.kuma.entrypoints=websecure-kuma
      - traefik.http.routers.kuma.tls=true
      - traefik.http.services.kuma.loadbalancer.server.port=3001
    environment:
      <<: *common-env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # SQLite lives here — block storage only, never NFS.
      - ${DOCKERCONFDIR}/uptime-kuma:/app/data
      # Read-only, for container-level monitors.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/ >/dev/null 2>&1 || wget -qO- http://127.0.0.1:3001/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  #  Tinyauth — profile: sso. Holds "/" on :8445
  #
  #  Single sign-on for the admin surface. The `auth@file` middleware
  #  every router above references is defined by install.sh: it points
  #  here under --auth=sso, and is a no-op under --auth=none. That
  #  indirection is why the routers need no conditional labels.
  #
  #  Not applied to Plex/Jellyfin (their clients cannot do forward
  #  auth) or Uptime Kuma (it has its own account).
  # ─────────────────────────────────────────────────────────────────
  tinyauth:
    <<: *arr-service
    profiles: [sso]
    container_name: tinyauth
    image: ghcr.io/tinyauthapp/tinyauth:${TINYAUTH_TAG}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.tinyauth.rule=PathPrefix(`/`)
      - traefik.http.routers.tinyauth.priority=1
      - traefik.http.routers.tinyauth.entrypoints=websecure-auth
      - traefik.http.routers.tinyauth.tls=true
      - traefik.http.services.tinyauth.loadbalancer.server.port=3000
      # Deliberately NOT behind auth@file: this is the login page.
    environment:
      <<: *common-env
      # v5 namespaces everything under TINYAUTH_. The flat names from
      # v3 (APP_URL, USERS_FILE, ...) are silently ignored, which shows
      # up as "app URL cannot be empty" rather than an unknown-variable
      # error — so do not trust a v3 example you find online.
      TINYAUTH_APPURL: ${TINYAUTH_APP_URL}
      TINYAUTH_APP_TITLE: media-suite
      # Credentials come from files, never the environment: a bcrypt
      # hash contains $$ that Compose would interpolate, and env values
      # are visible in `docker inspect`.
      TINYAUTH_AUTH_USERSFILE: /data/users
      TINYAUTH_SECRETFILE: /data/secret
      # v5 added a SQLite database for sessions. It lives under
      # DOCKERCONFDIR with the rest of the databases — block storage,
      # never NFS.
      TINYAUTH_DATABASE_PATH: /data/tinyauth.db
      TINYAUTH_AUTH_SECURECOOKIE: "true"
      # Only Traefik ever talks to this service. Naming that network
      # lets Tinyauth trust the forwarded client IP; without it the
      # container logs "IP access controls will NOT work" on boot.
      TINYAUTH_AUTH_TRUSTEDPROXIES: ${TINYAUTH_TRUSTED_PROXIES}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Writable: v5 creates tinyauth.db here on first start.
      - ${DOCKERCONFDIR}/tinyauth:/data
    # No healthcheck defined here on purpose: the image ships its own
    # (`tinyauth healthcheck`), which is better than anything written
    # here could be — v5 contains neither curl nor wget, so an HTTP
    # probe would fail for want of a client, leaving the container
    # permanently unhealthy. Traefik drops unhealthy containers from
    # routing, so that would lock every protected route behind an auth
    # service it then refuses to reach.

networks:
  traefik:
    external: true
